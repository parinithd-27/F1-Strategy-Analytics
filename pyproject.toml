[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "f1sa"
version = "0.1.0"
description = "F1 Strategy Analytics at Scale: event-driven undercut detection and what-if strategy simulation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Data Wranglers" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark==4.2.1",
    "fastf1==3.9.2",
    "redis>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "requests>=2.32",
    "requests-cache>=1.2",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "psutil>=6.0",
    "confluent-kafka>=2.6",
]

[project.scripts]
f1sa-ingest = "f1sa.ingest.cli:main"
f1sa-clean = "f1sa.etl.clean:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "fakeredis>=2.26",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
]

[tool.hatch.build.targets.wheel]
packages = ["src/f1sa"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["f1sa"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
# fastf1 and pandas ship no type information (pandas-stubs is not a dependency).
module = ["fastf1", "fastf1.*", "pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs running infra (make up)",
    "e2e: full end-to-end pipeline",
]
