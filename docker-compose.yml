# Local infrastructure for F1 Strategy Analytics.
# Profiles: core (kafka, redis, app, api) | hdfs (namenode, datanode) | spark (master + 2 workers)
#           full = core + hdfs + spark.
# Host ports reserved: 3000 web, 6379 redis, 8000 api, 9092 kafka, 9870 namenode UI.
# Host ports are overridable via the project .env (see .env.example). Memory budget:
# docs/architecture.md#memory-budget.
name: f1sa

x-app-image: &app-image
  image: f1sa-app:dev
  build:
    context: .
    dockerfile: docker/spark/Dockerfile
    args:
      APP_UID: ${APP_UID:-1000}

x-hadoop-image: &hadoop-image
  image: f1sa-hadoop:3.4.3
  build:
    context: docker/hadoop

x-spark-worker: &spark-worker
  <<: *app-image
  profiles: [spark, full]
  command:
    - spark-class
    - org.apache.spark.deploy.worker.Worker
    - --webui-port
    - "8081"
    - spark://spark-master:7077
  environment:
    SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1g}
    SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
    SPARK_WORKER_DIR: /tmp/spark-work
    SPARK_DAEMON_MEMORY: 256m
    SPARK_NO_DAEMONIZE: "true"
  depends_on:
    spark-master:
      condition: service_healthy
  mem_limit: ${SPARK_WORKER_CONTAINER_MEM:-1536m}
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8081"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- core
  kafka:
    image: apache/kafka:4.3.2
    profiles: [core, full]
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: FpClGoQZRm2tmqH60Q7RuA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 768m
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.2
    profiles: [core, full]
    entrypoint: ["/bin/bash", "/opt/f1sa/create-topics.sh"]
    environment:
      KAFKA_INTERNAL_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC_EVENTS: ${KAFKA_TOPIC_EVENTS:-f1.race.events}
      KAFKA_TOPIC_EVENTS_PARTITIONS: 3
    volumes:
      - ./docker/kafka/create-topics.sh:/opt/f1sa/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m
    restart: "no"

  redis:
    image: redis:8.10.3
    profiles: [core, full]
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-ttl
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  app:
    <<: *app-image
    profiles: [core, full]
    environment:
      DATA_LAKE_URI: ${APP_DATA_LAKE_URI:-file:///workspace/data/lake}
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC_EVENTS: ${KAFKA_TOPIC_EVENTS:-f1.race.events}
      REDIS_URL: redis://redis:6379/0
      HDFS_NAMENODE: hdfs://namenode:8020
      SPARK_MASTER_URL: spark://spark-master:7077
    volumes:
      - ./:/workspace:ro
      - ./data:/workspace/data
      - ./results:/workspace/results
      - ./models:/workspace/models
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 1536m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import pyspark, confluent_kafka, redis, f1sa" &&
          test -f "$$SPARK_HOME/jars/spark-sql-kafka-0-10_2.13-4.2.1.jar"
      interval: 15s
      timeout: 15s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # FastAPI backend (Step 13): Redis state + SSE. A replay runs the stream job and the producer
  # (API_MAX_REPLAYS=1). ./data is read-only except data/demo (outputs) and data/checkpoints
  # (stream-job state), mounted read-write on top; never results/. Two JVMs per replay: 2 GiB.
  # Bound to 0.0.0.0 inside the container, published on the host's 127.0.0.1 only. Models are
  # read-only. Sample lake by default; `make api-up FULL=1` sets API_DATA_LAKE_URI to HDFS.
  api:
    <<: *app-image
    profiles: [core, full]
    command: ["python", "-m", "f1sa.api"]
    environment:
      PYTHONPATH: /workspace/src
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:3000}
      DATA_LAKE_URI: ${API_DATA_LAKE_URI:-file:///workspace/data/lake}
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC_EVENTS: ${KAFKA_TOPIC_EVENTS:-f1.race.events}
      REDIS_URL: redis://redis:6379/0
      HDFS_HTTPFS_URL: http://httpfs:14000
      ENABLE_REPLAY: ${ENABLE_REPLAY:-0}
      ENABLE_DEBUG: ${ENABLE_DEBUG:-0}
      ALLOW_TEST_SEASON: ${ALLOW_TEST_SEASON:-0}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./:/workspace:ro
      - ./data:/workspace/data:ro
      - ./data/demo:/workspace/data/demo
      - ./data/checkpoints:/workspace/data/checkpoints
      - ./results:/workspace/results
      - ./models:/workspace/models:ro
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 2048m
    healthcheck:
      # The server answers: 200 (all checks pass) or 503 (a dependency is down) both count.
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=5)
          except urllib.error.HTTPError as exc:
              raise SystemExit(exc.code != 503)
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------- hdfs
  namenode:
    <<: *hadoop-image
    profiles: [hdfs, full]
    hostname: namenode
    command: ["/opt/f1sa/start-namenode.sh"]
    environment:
      HDFS_CLUSTER_ID: f1sa-dev
      HADOOP_HEAPSIZE_MAX: 512m
    ports:
      - "${HDFS_NAMENODE_UI_PORT:-9870}:9870"
    volumes:
      - hdfs-namenode:/opt/hadoop/data/name
    mem_limit: 768m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf 'http://localhost:9870/jmx?qry=Hadoop:service=NameNode,name=NameNodeStatus'
          | grep -q '"State" : "active"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  datanode:
    <<: *hadoop-image
    profiles: [hdfs, full]
    hostname: datanode
    command: ["hdfs", "datanode"]
    environment:
      HADOOP_HEAPSIZE_MAX: 512m
    volumes:
      - hdfs-datanode:/opt/hadoop/data/data
    depends_on:
      namenode:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      # healthy once registered with the NameNode (block-pool id assigned)
      test:
        - CMD-SHELL
        - >-
          curl -sf 'http://localhost:9864/jmx?qry=Hadoop:service=DataNode,name=DataNodeInfo'
          | grep -q 'BP-'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  httpfs:
    <<: *hadoop-image
    profiles: [hdfs, full]
    hostname: httpfs
    command: ["hdfs", "httpfs"]
    environment:
      HADOOP_HEAPSIZE_MAX: 256m
    ports:
      - "${HDFS_HTTPFS_PORT:-14000}:14000"
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf 'http://localhost:14000/webhdfs/v1/?op=GETFILESTATUS&user.name=hadoop' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------- spark
  spark-master:
    <<: *app-image
    profiles: [spark, full]
    hostname: spark-master
    command:
      - spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      SPARK_DAEMON_MEMORY: 256m
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  spark-worker-1:
    <<: *spark-worker
    hostname: spark-worker-1
    ports:
      - "${SPARK_WORKER1_UI_PORT:-8081}:8081"

  spark-worker-2:
    <<: *spark-worker
    hostname: spark-worker-2
    ports:
      - "${SPARK_WORKER2_UI_PORT:-8082}:8081"

volumes:
  kafka-data:
  hdfs-namenode:
  hdfs-datanode:
